version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Hold new releases for a week: hijacked versions are usually
    # caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # soroban-env-host 22.x does not compile against ed25519-dalek 3.0.
    # See the "Known pin" note in README.md before unignoring.
    ignore:
      - dependency-name: ed25519-dalek
        versions: ["3.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Hold new releases for a week: hijacked versions are usually
    # caught and pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
